name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - name: Regenerate check
        run: |
          node scripts/generate-modules.js
          git diff --exit-code -- makecomapp.json modules connections webhooks rpcs general || (
            echo "Generated files are stale — run npm run generate and commit."
            exit 1
          )
